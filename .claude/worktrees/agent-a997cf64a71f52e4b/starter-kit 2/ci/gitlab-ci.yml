#         -Dsonar.token=${SONAR_TOKEN}
#         -Dsonar.qualitygate.wait=true

architecture-tests:
  stage: quality
  <<: [*node_cache, *on_mr_or_main]
  needs: [lint]
  script:
    - |
      npx depcruise --validate .dependency-cruiser.js src 2>/dev/null || \
      lint-imports 2>/dev/null || \
      echo "No architecture test tool found — add dependency-cruiser or import-linter"
  allow_failure: true

secret-scanning:
  stage: quality
  needs: []   # Runs immediately, no dependencies
  rules:
    - when: always
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --verbose --log-level warn
  allow_failure: false   # Secrets = always block

dependency-audit:
  stage: quality
  <<: [*node_cache, *on_mr_or_main]
  needs: [install]
  script:
    - npm audit --audit-level=high
    # - pip-audit --fail-on-vuln
    # - mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
  allow_failure: false

sast:
  stage: quality
  <<: *on_mr_or_main
  needs: []
  image: returntocorp/semgrep
  script:
    - semgrep ci --config p/owasp-top-ten --config p/secrets
    # Adjust config: p/python, p/java, p/golang as needed
  allow_failure: true   # Remove once Semgrep baseline is established

# GitLab built-in SAST (if on GitLab Ultimate)
# include:
#   - template: Security/SAST.gitlab-ci.yml
#   - template: Security/Secret-Detection.gitlab-ci.yml
#   - template: Security/Dependency-Scanning.gitlab-ci.yml

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — BUILD (main branch only)
# ─────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  <<: [*node_cache, *on_main_only]
  needs: [quality-gate, dependency-audit, secret-scanning]
  script:
    - npm run build
    # - python setup.py bdist_wheel
    # - mvn package -DskipTests
  artifacts:
    paths:
      - dist/
      - build/
      # - target/*.jar
    expire_in: 1 week

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5 — DEPLOY STAGING (main branch, auto)
# ─────────────────────────────────────────────────────────────────────────────
deploy-staging:
  stage: deploy-staging
  <<: *on_main_only
  needs: [build]
  environment:
    name: staging
    url: $STAGING_URL
  script:
    - |
      # Replace with your deployment command:
      # ./scripts/deploy.sh staging
      # heroku container:push web --app my-app-staging
      # kubectl apply -f k8s/staging/ --namespace staging
      echo "Configure your staging deployment command here"
  variables:
    ENVIRONMENT: staging

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6 — SMOKE TEST (after every deploy)
# ─────────────────────────────────────────────────────────────────────────────
smoke-test-staging:
  stage: smoke
  <<: *on_main_only
  needs: [deploy-staging]
  image: alpine/curl:latest
  script:
    - |
      echo "Running smoke tests against $STAGING_URL"
      RETRIES=5
      for i in $(seq 1 $RETRIES); do
        status=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$STAGING_URL/health" 2>/dev/null || \
                 curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health" 2>/dev/null)
        if [ "$status" = "200" ]; then
          echo "✅ Health check passed (attempt $i)"
          break
        fi
        echo "Attempt $i: status=$status — retrying in 10s..."
        [ $i -eq $RETRIES ] && echo "❌ Smoke test FAILED after $RETRIES attempts" && exit 1
        sleep 10
      done

      # Application root responds
      status=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$STAGING_URL/" 2>/dev/null)
      [ "$status" -lt "500" ] && echo "✅ Application responds ($status)" || \
        (echo "❌ Application returned $status" && exit 1)

      echo "✅ All smoke tests passed"

  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "🚨 Smoke test failed — triggering rollback"
        # ./scripts/deploy.sh staging rollback
      fi

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 7 — DEPLOY PRODUCTION (manual approval)
# ─────────────────────────────────────────────────────────────────────────────
deploy-production:
  stage: deploy-prod
  <<: *on_main_only
  needs: [smoke-test-staging]
  environment:
    name: production
    url: $PRODUCTION_URL
  when: manual    # ← Requires manual approval in GitLab UI
  script:
    - |
      # ./scripts/deploy.sh production
      echo "Configure your production deployment command here"
  variables:
    ENVIRONMENT: production

smoke-test-production:
  stage: deploy-prod
  <<: *on_main_only
  needs: [deploy-production]
  image: alpine/curl:latest
  script:
    - |
      echo "Running production smoke tests"
      status=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/health")
      [ "$status" = "200" ] && echo "✅ Production health check passed" || \
        (echo "❌ Production health check FAILED — ROLLBACK NOW" && exit 1)

  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "🚨 PRODUCTION SMOKE TEST FAILED"
        # ./scripts/deploy.sh production rollback
      fi

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 8 — WEEKLY TESTS (scheduled pipeline)
# Configure: GitLab → CI/CD → Schedules → every Monday at 2am
# ─────────────────────────────────────────────────────────────────────────────
mutation-tests:
  stage: weekly
  <<: [*node_cache, *weekly_only]
  needs: []
  timeout: 90 minutes
  script:
    - npm ci
    - npx stryker run
    # - mutmut run --paths-to-mutate src/services/,src/domain/
    # - mvn org.pitest:pitest-maven:mutationCoverage
  artifacts:
    paths:
      - reports/mutation/
    expire_in: 30 days
    when: always

nfr-load-tests:
  stage: weekly
  <<: *weekly_only
  needs: []
  image: grafana/k6:latest
  script:
    - k6 run tests/load/smoke.js --out json=reports/k6-results.json
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
    when: always
  allow_failure: true

accessibility-audit:
  stage: weekly
  <<: [*node_cache, *weekly_only]
  needs: []
  services:
    - name: your-app-image:latest   # Replace with your Docker image
      alias: app
  script:
    - npm ci
    - npx @axe-core/cli http://app:3000 --save reports/axe-results.json
    - npx lighthouse http://app:3000
        --only-categories=accessibility,performance
        --output=json --output-path=reports/lighthouse.json --quiet
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
    when: always
  allow_failure: true
