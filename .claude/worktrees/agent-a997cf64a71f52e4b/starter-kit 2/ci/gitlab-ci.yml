# ─────────────────────────────────────────────────────────────────────────────
# Claude Code Starter Kit — GitLab CI/CD Pipeline
#
# SETUP REQUIRED (GitLab → Settings → CI/CD → Variables):
#
#   Required for all projects:
#   SONAR_TOKEN          → SonarQube token
#   SONAR_HOST_URL       → Your SonarQube URL
#
#   Required for deployment:
#   STAGING_URL          → Staging environment URL
#   PRODUCTION_URL       → Production environment URL
#   DEPLOY_KEY           → Deployment secret
#
#   Optional:
#   SNYK_TOKEN           → Snyk vulnerability scanning
#   PACT_BROKER_URL      → Contract testing broker
#   PACT_BROKER_TOKEN    → Contract testing token
#
# CUSTOMISE FOR YOUR STACK:
#   1. Replace npm commands with your package manager
#   2. Change the image: to match your runtime
#   3. Add/remove jobs based on your project
# ─────────────────────────────────────────────────────────────────────────────

image: node:20-alpine

# Pipeline stages — run in this order
stages:
  - verify          # Every commit: fast checks
  - test            # Every PR/MR: full tests
  - quality         # Every PR/MR: static analysis + security
  - build           # Every push to main: build artefacts
  - deploy-staging  # Every push to main: auto-deploy staging
  - smoke           # After every deploy: health check
  - deploy-prod     # Manual approval: production deploy
  - weekly          # Scheduled: mutation + nfr

# ── Shared config ─────────────────────────────────────────────────────────────
variables:
  NODE_ENV: test
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"

# Cache node_modules across jobs
.node_cache: &node_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull

.node_cache_push: &node_cache_push
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: push

# Only run on MR or main/dev branches (skip feature branch pushes without MR)
.on_mr_or_main: &on_mr_or_main
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'dev'

.on_main_only: &on_main_only
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

.weekly_only: &weekly_only
  rules:
    - if: $CI_PIPELINE_SOURCE == 'schedule'

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — VERIFY (every commit, < 5 min)
# ─────────────────────────────────────────────────────────────────────────────
install:
  stage: verify
  <<: *node_cache_push
  rules:
    - when: always
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: verify
  <<: *node_cache
  needs: [install]
  rules:
    - when: always
  script:
    - npm run lint
    - npm run type-check
    # For Python: pip install ruff mypy && ruff check . && mypy src/
  allow_failure: false

unit-tests:
  stage: verify
  <<: *node_cache
  needs: [install]
  rules:
    - when: always
  script:
    - npm run test:unit -- --coverage
    # For Python: pytest tests/unit/ --tb=short --cov=src --cov-report=xml
    # For Java: mvn test -Dtest="**/*UnitTest"
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit:
        - junit.xml
    paths:
      - coverage/
    expire_in: 7 days

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — TEST (every MR, needs real services)
# ─────────────────────────────────────────────────────────────────────────────
integration-tests:
  stage: test
  <<: [*node_cache, *on_mr_or_main]
  needs: [lint, unit-tests]

  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_DB: test_db
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
    - name: redis:7
      alias: redis
    # Uncomment for RabbitMQ:
    # - name: rabbitmq:3-management
    #   alias: rabbitmq

  variables:
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
    REDIS_URL: redis://redis:6379

  script:
    - npm run migrate
    - npm run test:integration
    # - pytest tests/integration/ --tb=short
    # - mvn test -Dtest="**/*IntegrationTest"

  artifacts:
    when: always
    reports:
      junit: junit-integration.xml
    expire_in: 7 days

contract-tests:
  stage: test
  <<: [*node_cache, *on_mr_or_main]
  needs: [integration-tests]
  variables:
    PACT_BROKER_URL: $PACT_BROKER_URL
    PACT_BROKER_TOKEN: $PACT_BROKER_TOKEN
  script:
    - npm run test:contract
    # - python -m pytest tests/contract/
  allow_failure: true   # Remove once Pact is configured

data-tests:
  stage: test
  <<: [*node_cache, *on_mr_or_main]
  needs: [integration-tests]
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_DB: test_db
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
  variables:
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
  script:
    - npm run test:data
    # - pytest tests/data/ --tb=short
    # - dbt test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - "**/migrations/**"
        - "**/schema*"
        - "**/*.sql"
        - "**/prisma/**"
    - if: $CI_COMMIT_BRANCH == 'main'

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — QUALITY + SECURITY (every MR)
# Parallel execution — saves time.
# ─────────────────────────────────────────────────────────────────────────────
# Detect stack and run appropriate free tools — SonarQube is optional
.detect_stack: &detect_stack
  - |
    [ -f package.json ]                                && export STACK=nodejs  || true
    [ -f pyproject.toml ] || [ -f requirements.txt ]   && export STACK=python  || true
    [ -f pom.xml ]                                     && export STACK=java    || true
    [ -f go.mod ]                                      && export STACK=go      || true
    [ -f Cargo.toml ]                                  && export STACK=rust    || true
    [ -f Gemfile ]                                     && export STACK=ruby    || true
    ls *.sln *.csproj 2>/dev/null                      && export STACK=dotnet  || true
    echo "Stack detected: $STACK"

quality-gate-node:
  stage: quality
  image: node:20-alpine
  <<: [*node_cache, *on_mr_or_main]
  needs: [integration-tests]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      exists:
        - package.json
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - package.json
  script:
    - npm ci
    - npx eslint . --max-warnings 0
    - npx tsc --noEmit
    - '[ -f biome.json ] && npx @biomejs/biome check . || true'
    - npx knip --reporter compact || true
    - npx semgrep --config p/owasp-top-ten --config p/javascript . --quiet || true

quality-gate-python:
  stage: quality
  image: python:3.12-slim
  <<: *on_mr_or_main
  needs: [integration-tests]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      exists:
        - pyproject.toml
        - requirements.txt
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - pyproject.toml
  script:
    - pip install ruff mypy pylint bandit vulture --quiet
    - ruff check .
    - mypy src/ --ignore-missing-imports || true
    - pylint $(find . -name "*.py" | grep -v ".git\|venv\|__pycache__" | head -50) --score=yes || true
    - bandit -r . -ll
    - vulture . --min-confidence 80 || true
    - pip install semgrep --quiet && semgrep --config p/python . --quiet || true

quality-gate-java:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  <<: *on_mr_or_main
  needs: [integration-tests]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      exists:
        - pom.xml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - pom.xml
  script:
    - mvn checkstyle:check -q
    - mvn spotbugs:check -q || true
    - mvn pmd:check -q || true

quality-gate-go:
  stage: quality
  image: golang:1.22-alpine
  <<: *on_mr_or_main
  needs: [integration-tests]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      exists:
        - go.mod
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - go.mod
  script:
    - go vet ./...
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run
    - go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./... || true

quality-gate-rust:
  stage: quality
  image: rust:latest
  <<: *on_mr_or_main
  needs: [integration-tests]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      exists:
        - Cargo.toml
  script:
    - cargo check
    - cargo clippy -- -D warnings

semgrep:
  stage: quality
  image: returntocorp/semgrep
  <<: *on_mr_or_main
  needs: []
  script:
    - semgrep ci --config p/owasp-top-ten --config p/secrets
  allow_failure: true

# SonarQube — OPTIONAL: only add this job if you have a SonarQube instance
# Remove the comment markers below to enable:
